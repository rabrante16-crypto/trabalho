<style>
  :root{

    --good:#006300; --bad:#c62828;
    --chip-bg:#f0efec;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --surface-1:#1a1a19; --surface-2:#0d0d0d; --surface-3:#222221;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
      --good:#0ca30c; --bad:#e66767;
      --chip-bg:#2a2a28;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-1:#1a1a19; --surface-2:#0d0d0d; --surface-3:#222221;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good:#0ca30c; --bad:#e66767;
    --chip-bg:#2a2a28;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--surface-2);color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;}
  body{padding-bottom:60px;}
  .wrap{max-width:1280px;margin:0 auto;padding:0 20px;}
  header.top{background:var(--surface-1);border-bottom:1px solid var(--border);padding:20px 0 16px;}
  header.top h1{font-size:22px;margin:0 0 4px;}
  header.top .sub{color:var(--text-secondary);font-size:13.5px;line-height:1.5;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  select, input[type=search]{
    background:var(--surface-3);color:var(--text-primary);border:1px solid var(--border);
    border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;
  }
  button.themebtn{
    background:var(--surface-3);color:var(--text-primary);border:1px solid var(--border);
    border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;
  }
  nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0 0;border-bottom:1px solid var(--border);margin-top:14px;}
  nav.tabs button{
    background:transparent;border:none;color:var(--text-secondary);padding:9px 14px;font-size:13.5px;
    cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap;font-family:inherit;
  }
  nav.tabs button.active{color:var(--text-primary);background:var(--surface-2);font-weight:600;box-shadow: inset 0 -2px 0 var(--s1);}
  section.panel{display:none;padding:22px 0 10px;}
  section.panel.active{display:block;}
  h2.h{font-size:16px;margin:26px 0 4px;}
  h2.h:first-child{margin-top:0;}
  p.desc{color:var(--text-secondary);font-size:13px;margin:0 0 14px;max-width:900px;line-height:1.5;}
  .grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0 6px;}
  .tile{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .tile .label{font-size:12px;color:var(--text-secondary);margin-bottom:6px;}
  .tile .value{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;}
  .tile .delta{font-size:12.5px;margin-top:4px;font-variant-numeric:tabular-nums;}
  .delta.up{color:var(--good);} .delta.down{color:var(--bad);}
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:14px 0;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:860px){.row2{grid-template-columns:1fr;}}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--text-secondary);margin-bottom:6px;flex-wrap:wrap;}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
  table.dtable{border-collapse:collapse;width:100%;font-size:12.8px;}
  table.dtable th{
    text-align:right;color:var(--text-muted);font-weight:600;font-size:11.5px;text-transform:uppercase;
    letter-spacing:.02em;padding:8px 8px;border-bottom:1px solid var(--baseline);cursor:pointer;user-select:none;white-space:nowrap;
  }
  table.dtable th:first-child, table.dtable td:first-child{text-align:left;}
  table.dtable th.sorted{color:var(--text-primary);}
  table.dtable td{padding:7px 8px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  table.dtable tbody tr:hover{background:var(--surface-2);}
  table.dtable tr.child td{color:var(--text-secondary);}
  table.dtable tr.child td:first-child{padding-left:24px;}
  table.dtable tr.total td{font-weight:700;border-top:2px solid var(--baseline);}
  table.dtable tr.child-detail td{background:var(--surface-2);padding:8px 8px 12px 24px;white-space:normal;text-align:left;border-bottom:1px solid var(--baseline);}
  table.dtable.mini{font-size:12px;}
  table.dtable.mini th{font-size:10.5px;padding:5px 7px;position:sticky;top:0;background:var(--surface-2);}
  table.dtable.mini td{padding:5px 7px;}
  .tbl-wrap{overflow-x:auto;}
  .pos{color:var(--good);} .neg{color:var(--bad);}
  .expand-btn{cursor:pointer;color:var(--s1);font-size:11px;margin-right:6px;display:inline-block;width:12px;}
  .searchbar{margin-bottom:10px;display:flex;gap:8px;align-items:center;}
  .note{background:var(--chip-bg);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--text-secondary);line-height:1.6;margin:10px 0;}
  .note b{color:var(--text-primary);}
  footer.foot{margin-top:30px;padding:16px 0;border-top:1px solid var(--border);color:var(--text-muted);font-size:11.5px;line-height:1.6;}
  .chartbox{width:100%;overflow-x:auto;}
  svg.chart text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text-secondary);}
  svg.chart .axisline{stroke:var(--baseline);}
  svg.chart .gridline{stroke:var(--grid);}
  .tooltip{
    position:fixed;pointer-events:none;background:var(--surface-3);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text-primary);box-shadow:0 4px 16px rgba(0,0,0,.15);
    z-index:50;display:none;line-height:1.5;
  }
  .badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;background:var(--chip-bg);color:var(--text-secondary);}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--baseline);border-radius:8px;}
</style>

<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('data-json').textContent);

// ---------- formatting ----------
function fmtInt(v){ if(v==null||isNaN(v)) return '-'; return Math.round(v).toLocaleString('pt-BR'); }
function fmtNum(v,d){ if(v==null||isNaN(v)) return '-'; return v.toLocaleString('pt-BR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function fmtBRL(v){ if(v==null||isNaN(v)) return '-'; return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtPct(v){ if(v==null||isNaN(v)) return '-'; return (v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }
function signClass(v){ return v>0?'pos':(v<0?'neg':''); }
function fmtSignedInt(v){ return (v>0?'+':'')+fmtInt(v); }
function fmtSignedBRL(v){ return (v>0?'+':'')+fmtBRL(v); }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
var _measureCtx = document.createElement('canvas').getContext('2d');
_measureCtx.font = '12px system-ui,-apple-system,"Segoe UI",sans-serif';
function truncateToWidth(s, maxWidth){
  if(!s) return '';
  s = String(s);
  if(_measureCtx.measureText(s).width<=maxWidth) return s;
  var lo=0, hi=s.length;
  while(lo<hi){
    var mid=(lo+hi+1)>>1;
    if(_measureCtx.measureText(s.slice(0,mid)+'…').width<=maxWidth) lo=mid; else hi=mid-1;
  }
  return lo<=0 ? '…' : s.slice(0,lo)+'…';
}
// brand/setor codes look like "1234 - NAME" -> keep just NAME for compact charts
function niceName(s){
  if(!s) return '';
  var m = String(s).match(/^\d{3,4}\s*-\s*(.+)$/);
  return m ? m[1] : s;
}

// ---------- tooltip ----------
var tipEl = document.getElementById('tooltip');
function showTip(html, evt){
  tipEl.innerHTML = html;
  tipEl.style.display = 'block';
  var x = evt.clientX+14, y = evt.clientY+14;
  var vw = window.innerWidth, vh = window.innerHeight;
  requestAnimationFrame(function(){
    var r = tipEl.getBoundingClientRect();
    if(x+r.width>vw-8) x = evt.clientX - r.width - 14;
    if(y+r.height>vh-8) y = evt.clientY - r.height - 14;
    tipEl.style.left = x+'px'; tipEl.style.top = y+'px';
  });
}
function hideTip(){ tipEl.style.display='none'; }

// ================= CHART: horizontal grouped bars (two periods) =================
function hGroupedBar(items, opts){
  // items: [{label, v1, v2}]  opts:{formatter, colorA, colorB, labelA, labelB, highlight}
  opts = opts||{};
  var fmt = opts.formatter || fmtInt;
  var colorA = opts.colorA || 'var(--baseline)';
  var colorB = opts.colorB || 'var(--s1)';
  var rowH = 34, gap = 6, labelW = opts.labelW||240, chartW = 560, pad=8, valueW = 110;
  var maxV = Math.max(1, ...items.map(function(d){return Math.max(Math.abs(d.v1||0),Math.abs(d.v2||0));}));
  var h = items.length*(rowH+gap);
  var svgW = labelW+chartW+valueW;
  var svg = ['<svg class="chart" viewBox="0 0 '+svgW+' '+(h+10)+'" width="100%" style="max-width:'+svgW+'px" height="'+(h+10)+'">'];
  items.forEach(function(d,i){
    var y = i*(rowH+gap);
    var w1 = Math.max(0,(Math.abs(d.v1||0)/maxV)*(chartW-4));
    var w2 = Math.max(0,(Math.abs(d.v2||0)/maxV)*(chartW-4));
    var barH = (rowH-6)/2;
    var hl = opts.highlight && opts.highlight===d.label;
    svg.push('<text x="'+(labelW-8)+'" y="'+(y+rowH/2+4)+'" text-anchor="end" font-size="12" font-weight="'+(hl?'700':'400')+'" fill="'+(hl?'var(--text-primary)':'var(--text-secondary)')+'">'+esc(truncateToWidth(d.label,labelW-14))+'</text>');
    svg.push('<rect x="'+labelW+'" y="'+y+'" width="'+w1+'" height="'+barH+'" rx="3" fill="'+colorA+'" data-i="'+i+'" data-s="1"></rect>');
    svg.push('<text x="'+(labelW+w1+6)+'" y="'+(y+barH/2+4)+'" font-size="10.5" fill="var(--text-secondary)">'+fmt(d.v1)+'</text>');
    svg.push('<rect x="'+labelW+'" y="'+(y+barH+6)+'" width="'+w2+'" height="'+barH+'" rx="3" fill="'+colorB+'" data-i="'+i+'" data-s="2"></rect>');
    svg.push('<text x="'+(labelW+w2+6)+'" y="'+(y+barH+6+barH/2+4)+'" font-size="10.5" fill="var(--text-secondary)">'+fmt(d.v2)+'</text>');
  });
  svg.push('</svg>');
  var wrap = document.createElement('div');
  wrap.className='chartbox';
  wrap.innerHTML = svg.join('');
  var svgEl = wrap.querySelector('svg');
  svgEl.querySelectorAll('rect').forEach(function(r){
    r.addEventListener('mousemove', function(e){
      var i = +r.getAttribute('data-i'), s = r.getAttribute('data-s');
      var d = items[i];
      var val = s==='1'? d.v1 : d.v2;
      var lab = s==='1'? (opts.labelA||'Período anterior') : (opts.labelB||'Período atual');
      showTip('<b>'+esc(d.label)+'</b><br>'+lab+': '+fmt(val), e);
    });
    r.addEventListener('mouseleave', hideTip);
  });
  return wrap;
}

// ================= CHART: simple top-N horizontal bars (single series) =================
function topBar(items, opts){
  opts = opts||{};
  var fmt = opts.formatter || fmtInt;
  var color = opts.color || 'var(--s1)';
  var rowH=26, gap=5, labelW=opts.labelW||170, chartW=380;
  var maxV = Math.max(1, ...items.map(function(d){return d.value||0;}));
  var h = items.length*(rowH+gap);
  var svgW = labelW+chartW+90;
  var svg = ['<svg class="chart" viewBox="0 0 '+svgW+' '+(h+10)+'" width="100%" style="max-width:'+svgW+'px" height="'+(h+10)+'">'];
  items.forEach(function(d,i){
    var y=i*(rowH+gap);
    var w = Math.max(1,(d.value||0)/maxV*(chartW-8));
    svg.push('<text x="'+(labelW-8)+'" y="'+(y+rowH/2+4)+'" text-anchor="end" font-size="12">'+esc(truncateToWidth(d.label,labelW-14))+'</text>');
    svg.push('<rect x="'+labelW+'" y="'+(y+3)+'" width="'+w+'" height="'+(rowH-6)+'" rx="3" fill="'+color+'" data-i="'+i+'"></rect>');
    svg.push('<text x="'+(labelW+w+6)+'" y="'+(y+rowH/2+4)+'" font-size="11" fill="var(--text-secondary)">'+fmt(d.value)+'</text>');
  });
  svg.push('</svg>');
  var wrap=document.createElement('div'); wrap.className='chartbox'; wrap.innerHTML=svg.join('');
  wrap.querySelectorAll('rect').forEach(function(r){
    r.addEventListener('mousemove', function(e){
      var i=+r.getAttribute('data-i'); var d=items[i];
      showTip('<b>'+esc(d.label)+'</b><br>'+fmt(d.value), e);
    });
    r.addEventListener('mouseleave', hideTip);
  });
  return wrap;
}

// ================= CHART: one-sided bar for uniformly-signed lists (avoids diverging-axis overlap) =================
function signBar(items, opts){
  // items: [{label, value}] all same sign (or zero); renders like topBar but colored by sign and label shows the true signed value
  opts = opts||{};
  var fmt = opts.formatter || fmtSignedInt;
  var color = opts.color || 'var(--s1)';
  var rowH=26, gap=5, labelW=opts.labelW||210, chartW=380;
  var absItems = items.map(function(d){ return {label:d.label, value:Math.abs(d.value||0), raw:d.value}; });
  var maxV = Math.max(1, ...absItems.map(function(d){return d.value;}));
  var h = absItems.length*(rowH+gap);
  var svgW = labelW+chartW+90;
  var svg = ['<svg class="chart" viewBox="0 0 '+svgW+' '+(h+10)+'" width="100%" style="max-width:'+svgW+'px" height="'+(h+10)+'">'];
  absItems.forEach(function(d,i){
    var y=i*(rowH+gap);
    var w = Math.max(1,d.value/maxV*(chartW-8));
    svg.push('<text x="'+(labelW-8)+'" y="'+(y+rowH/2+4)+'" text-anchor="end" font-size="12">'+esc(truncateToWidth(d.label,labelW-14))+'</text>');
    svg.push('<rect x="'+labelW+'" y="'+(y+3)+'" width="'+w+'" height="'+(rowH-6)+'" rx="3" fill="'+color+'" data-i="'+i+'"></rect>');
    svg.push('<text x="'+(labelW+w+6)+'" y="'+(y+rowH/2+4)+'" font-size="11" fill="'+color+'">'+fmt(d.raw)+'</text>');
  });
  svg.push('</svg>');
  var wrap=document.createElement('div'); wrap.className='chartbox'; wrap.innerHTML=svg.join('');
  wrap.querySelectorAll('rect').forEach(function(r){
    r.addEventListener('mousemove', function(e){
      var i=+r.getAttribute('data-i'); var d=absItems[i];
      showTip('<b>'+esc(d.label)+'</b><br>'+fmt(d.raw), e);
    });
    r.addEventListener('mouseleave', hideTip);
  });
  return wrap;
}

// ================= TABLE component (sortable + searchable + expandable) =================
function buildTable(opts){
  // opts: {columns:[{key,label,fmt,cls}], rows, totalRow, childKey, searchable, defaultSortKey, defaultSortDesc}
  var box = document.createElement('div');
  var searchVal = '';
  var sortKey = opts.defaultSortKey || null;
  var sortDesc = opts.defaultSortDesc!==false;
  var expanded = {};
  var searchFocusPending = false;

  function matches(row){
    if(!searchVal) return true;
    var label = String(row[opts.columns[0].key]||'').toLowerCase();
    return label.indexOf(searchVal.toLowerCase())>-1;
  }

  function render(){
    var rows = opts.rows.slice();
    if(sortKey){
      rows.sort(function(a,b){
        var av=a[sortKey], bv=b[sortKey];
        if(av==null) av = -Infinity; if(bv==null) bv = -Infinity;
        if(typeof av==='string') return sortDesc? String(bv).localeCompare(av) : String(av).localeCompare(bv);
        return sortDesc? (bv-av) : (av-bv);
      });
    }
    var visRows = opts.searchable ? rows.filter(matches) : rows;
    var html = '<div class="tbl-wrap"><table class="dtable"><thead><tr>';
    opts.columns.forEach(function(c){
      html += '<th data-k="'+c.key+'" class="'+(sortKey===c.key?'sorted':'')+'">'+esc(c.label)+(sortKey===c.key?(sortDesc?' ▼':' ▲'):'')+'</th>';
    });
    html += '</tr></thead><tbody>';
    visRows.forEach(function(row, idx){
      var hasChildren = opts.childKey && row[opts.childKey] && row[opts.childKey].length;
      var rid = 'r'+idx+'_'+(row[opts.columns[0].key]||'').replace(/[^a-z0-9]/gi,'');
      html += '<tr>';
      opts.columns.forEach(function(c,ci){
        var v = row[c.key];
        var content = c.fmt ? c.fmt(v,row) : esc(v);
        if(ci===0 && hasChildren){
          var isOpen = expanded[rid];
          content = '<span class="expand-btn" data-rid="'+rid+'">'+(isOpen?'▼':'▶')+'</span>'+content;
        } else if(ci===0){
          content = '<span style="display:inline-block;width:18px"></span>'+content;
        }
        html += '<td class="'+(c.cls?c.cls(v,row):'')+'">'+content+'</td>';
      });
      html += '</tr>';
      if(hasChildren && expanded[rid]){
        html += '<tr class="child-detail"><td colspan="'+opts.columns.length+'">'+
          (opts.childRenderer ? opts.childRenderer(row[opts.childKey], row, expanded, rid) : '') +
          '</td></tr>';
      }
    });
    if(opts.totalRow){
      html += '<tr class="total">';
      opts.columns.forEach(function(c){
        var v = opts.totalRow[c.key];
        html += '<td>'+(c.fmt?c.fmt(v,opts.totalRow):esc(v))+'</td>';
      });
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    box.innerHTML = (opts.searchable ? '<div class="searchbar"><input type="search" placeholder="Buscar..." id="'+opts._id+'_search" value="'+esc(searchVal)+'" style="min-width:220px"><span class="badge">'+visRows.length+' de '+rows.length+'</span></div>' : '') + html;

    if(opts.searchable){
      var inp = box.querySelector('#'+opts._id+'_search');
      if(searchFocusPending){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
      inp.addEventListener('input', function(){ searchVal = inp.value; searchFocusPending = true; render(); });
    }
    box.querySelectorAll('th[data-k]').forEach(function(th){
      th.addEventListener('click', function(){
        var k = th.getAttribute('data-k');
        if(sortKey===k) sortDesc = !sortDesc; else { sortKey=k; sortDesc=true; }
        render();
      });
    });
    box.querySelectorAll('.expand-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var rid = btn.getAttribute('data-rid');
        expanded[rid] = !expanded[rid];
        render();
      });
    });
    // sortable headers inside drill-down / nested mini-tables (childRenderer output);
    // stored in the same `expanded` bag under a "sort:" prefix so it survives re-renders.
    box.querySelectorAll('th[data-sk]').forEach(function(th){
      th.addEventListener('click', function(e){
        e.stopPropagation();
        var tid = th.getAttribute('data-st'), k = th.getAttribute('data-sk');
        var skey = 'sort:'+tid;
        var cur = expanded[skey] || {};
        if(cur.key===k) cur.desc = !cur.desc; else { cur = {key:k, desc:true}; }
        expanded[skey] = cur;
        render();
      });
    });
  }
  opts._id = 'tbl'+Math.random().toString(36).slice(2);
  render();
  return box;
}

// ================= sortable mini-table helpers (used by drill-down childRenderers) =================
function miniSortState(expanded, tableId, defaultKey, defaultDesc){
  return (expanded && expanded['sort:'+tableId]) || {key:defaultKey, desc:defaultDesc!==false};
}
function miniSortedRows(rows, sortInfo){
  var key = sortInfo.key, desc = sortInfo.desc!==false;
  var out = rows.slice();
  out.sort(function(a,b){
    var av=a[key], bv=b[key];
    var aIsStr = typeof av==='string', bIsStr = typeof bv==='string';
    if(av==null) av = aIsStr||bIsStr ? '' : -Infinity;
    if(bv==null) bv = aIsStr||bIsStr ? '' : -Infinity;
    if(typeof av==='string' || typeof bv==='string') return desc ? String(bv).localeCompare(String(av)) : String(av).localeCompare(String(bv));
    return desc ? (bv-av) : (av-bv);
  });
  return out;
}
function miniTh(label, key, tableId, sortInfo){
  var active = sortInfo.key===key;
  return '<th data-sk="'+key+'" data-st="'+tableId+'"'+(active?' class="sorted"':'')+'>'+esc(label)+(active?(sortInfo.desc?' ▼':' ▲'):'')+'</th>';
}

// ================= aggregation engine (drives the Setor filter across every tab) =================
// DATA.rows: [setorIdx,brickIdx,marcaIdx,canalIdx,provedorIdx,tipoPdvIdx,municipioIdx,bandeiraIdx,pdvIdx, u25,u26,r25,r26]
var DIM_ORDER = ['Setor','Brick','Marca','Canal','Provedor','Tipo PDV','Municipio','Bandeira','PDV'];
var COL = {}; DIM_ORDER.forEach(function(name,i){ COL[name]=i; });
var COL_U25=9, COL_U26=10, COL_R25=11, COL_R26=12;
// Agosto/26 está parcial nesta base (apenas DATA.file_info.dias_coletados dias de coleta) --
// unid_jun26/reais_jun26 guardam o valor RAW (parcial) de cada linha; unid_proj/reais_proj
// aplicam o fator de projeção (dias_mes/dias_coletados) para estimar o mês cheio, replicando
// a mesma fórmula usada nas versões anteriores do dashboard para meses parciais.
function round2(v){ return Math.round(v*100)/100; }
var PROJ_FACTOR = DATA.file_info.proj_factor || 1;

function makeAgg(u25,u26,r25,r26){
  var proj_u = u26*PROJ_FACTOR, proj_r = r26*PROJ_FACTOR;
  return {
    unid_jun25: round2(u25), unid_jun26: round2(u26), unid_proj: round2(proj_u),
    reais_jun25: round2(r25), reais_jun26: round2(r26), reais_proj: round2(proj_r),
    unid_increm: round2(proj_u-u25), unid_evol: u25 ? (proj_u-u25)/u25 : null,
    reais_increm: round2(proj_r-r25), reais_evol: r25 ? (proj_r-r25)/r25 : null,
  };
}

function setorIdxOf(setorLabel){
  if(!setorLabel || setorLabel==='Todos') return null;
  var i = DATA.dims.Setor.indexOf(setorLabel);
  return i>=0 ? i : null;
}

function aggregateBy(dimName, setorFilterIdx){
  var col = COL[dimName];
  var names = DATA.dims[dimName];
  var map = {};
  DATA.rows.forEach(function(row){
    if(setorFilterIdx!=null && row[COL.Setor]!==setorFilterIdx) return;
    var k = row[col];
    var e = map[k]; if(!e){ e=[0,0,0,0]; map[k]=e; }
    e[0]+=row[COL_U25]; e[1]+=row[COL_U26]; e[2]+=row[COL_R25]; e[3]+=row[COL_R26];
  });
  var out=[];
  Object.keys(map).forEach(function(k){
    var v = map[k];
    var agg = makeAgg(v[0],v[1],v[2],v[3]);
    agg.key = names[k];
    out.push(agg);
  });
  return out;
}

function aggregateBy2(dimA, dimB, setorFilterIdx){
  var colA=COL[dimA], colB=COL[dimB];
  var namesA=DATA.dims[dimA], namesB=DATA.dims[dimB];
  var map={};
  DATA.rows.forEach(function(row){
    if(setorFilterIdx!=null && row[COL.Setor]!==setorFilterIdx) return;
    var k = row[colA]+'_'+row[colB];
    var e = map[k]; if(!e){ e=[row[colA],row[colB],0,0,0,0]; map[k]=e; }
    e[2]+=row[COL_U25]; e[3]+=row[COL_U26]; e[4]+=row[COL_R25]; e[5]+=row[COL_R26];
  });
  var out=[];
  Object.keys(map).forEach(function(k){
    var v = map[k];
    var agg = makeAgg(v[2],v[3],v[4],v[5]);
    agg.keyA = namesA[v[0]]; agg.keyB = namesB[v[1]];
    out.push(agg);
  });
  return out;
}

function distinctCount(dimName, setorFilterIdx){
  var col = COL[dimName];
  var seen = {}; var n=0;
  DATA.rows.forEach(function(row){
    if(setorFilterIdx!=null && row[COL.Setor]!==setorFilterIdx) return;
    var k = row[col];
    if(!seen[k]){ seen[k]=true; n++; }
  });
  return n;
}

// every Brick in this dataset belongs to exactly one Setor (verified) — build brickIdx -> setorIdx once
var BRICK_SETOR = (function(){
  var m = {};
  DATA.rows.forEach(function(row){ m[row[COL.Brick]] = row[COL.Setor]; });
  return m;
})();
function setorOfBrick(brickName){
  var brickIdx = DATA.dims.Brick.indexOf(brickName);
  var setorIdx = BRICK_SETOR[brickIdx];
  return setorIdx!=null ? DATA.dims.Setor[setorIdx] : null;
}

// ================= PDV drill-down (which PDV/Brick/Bandeira make up an aggregate) =================
function pdvBreakdown(filterFn, setorFilterIdx){
  var map = {};
  DATA.rows.forEach(function(row){
    if(setorFilterIdx!=null && row[COL.Setor]!==setorFilterIdx) return;
    if(!filterFn(row)) return;
    var pdvIdx = row[COL.PDV];
    var e = map[pdvIdx];
    if(!e){ e = {u25:0,u26:0,r25:0,r26:0, brickIdx:row[COL.Brick], bandeiraIdx:row[COL.Bandeira], setorIdx:row[COL.Setor]}; map[pdvIdx]=e; }
    e.u25+=row[COL_U25]; e.u26+=row[COL_U26]; e.r25+=row[COL_R25]; e.r26+=row[COL_R26];
  });
  var out=[];
  Object.keys(map).forEach(function(k){
    var e = map[k];
    var agg = makeAgg(e.u25,e.u26,e.r25,e.r26);
    agg.pdv = DATA.dims.PDV[k];
    agg.brick = DATA.dims.Brick[e.brickIdx];
    agg.bandeira = DATA.dims.Bandeira[e.bandeiraIdx];
    agg.setor = DATA.dims.Setor[e.setorIdx];
    out.push(agg);
  });
  return out.sort(function(a,b){return b.reais_proj-a.reais_proj;});
}

function pdvMiniTable(pdvRows, opts, expanded, tableId){
  opts = opts||{};
  var pdvFilter = opts.pdvFilterFn ? opts.pdvFilterFn() : null;
  if(pdvFilter){
    pdvRows = (pdvRows||[]).filter(function(p){ return String(p.pdv||'').toLowerCase().indexOf(pdvFilter.toLowerCase())>-1; });
  }
  if(!pdvRows || !pdvRows.length){
    return '<div style="padding:4px 0;color:var(--text-secondary);font-size:12px">'+
      (pdvFilter ? 'Nenhum PDV corresponde à busca "'+esc(pdvFilter)+'" neste recorte.' :
        ('Nenhum PDV com venda encontrado para este recorte'+(opts.showSetor===false?'':' (dentro do setor selecionado, se houver filtro ativo)')+'.'))+
      '</div>';
  }
  var showSetor = opts.showSetor!==false && currentSetor==='Todos';
  var showBrick = opts.showBrick!==false;
  var showBandeira = opts.showBandeira!==false;
  tableId = tableId || 'pdvMini';
  var sortInfo = miniSortState(expanded, tableId, 'reais_proj', true);
  var shown = miniSortedRows(pdvRows, sortInfo);
  var countNote = pdvRows.length+' PDV(s) compõem este total (clique num cabeçalho para ordenar'+(pdvRows.length>10?'; role a lista para ver todos':'')+'):';
  var html = '<div style="font-size:11.5px;color:var(--text-secondary);margin-bottom:4px">'+countNote+'</div>'+
    '<div class="tbl-wrap" style="max-height:340px;overflow-y:auto"><table class="dtable mini"><thead><tr>'+
    (showSetor?miniTh('Setor','setor',tableId,sortInfo):'')+miniTh('PDV','pdv',tableId,sortInfo)+
    (showBrick?miniTh('Brick','brick',tableId,sortInfo):'')+(showBandeira?miniTh('Rede (Bandeira)','bandeira',tableId,sortInfo):'')+
    miniTh(DATA.file_info.periodo_anterior+' Unid','unid_jun25',tableId,sortInfo)+miniTh(DATA.file_info.periodo_atual+' Unid','unid_proj',tableId,sortInfo)+
    miniTh(DATA.file_info.periodo_atual+' R$','reais_proj',tableId,sortInfo)+miniTh('Increm R$','reais_increm',tableId,sortInfo)+
    '</tr></thead><tbody>';
  shown.forEach(function(p){
    html += '<tr>'+
      (showSetor?'<td style="text-align:left">'+esc(niceName(p.setor))+'</td>':'')+
      '<td style="text-align:left">'+esc(p.pdv)+'</td>'+
      (showBrick?'<td style="text-align:left">'+esc(niceName(p.brick))+'</td>':'')+
      (showBandeira?'<td style="text-align:left">'+esc(p.bandeira)+'</td>':'')+
      '<td>'+fmtInt(p.unid_jun25)+'</td><td>'+fmtInt(p.unid_proj)+'</td><td>'+fmtBRL(p.reais_proj)+'</td>'+
      '<td><span class="'+signClass(p.reais_increm)+'">'+fmtSignedBRL(p.reais_increm)+'</span></td>'+
      '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

// group PDV-level rows (already run through makeAgg) into one consolidated row per Setor
function groupPdvBySetor(pdvRows){
  var map = {};
  pdvRows.forEach(function(p){
    var k = p.setor;
    var e = map[k]; if(!e){ e = {setor:k, u25:0, u26:0, r25:0, r26:0, pdvs:[]}; map[k]=e; }
    e.u25+=p.unid_jun25; e.u26+=p.unid_jun26; e.r25+=p.reais_jun25; e.r26+=p.reais_jun26;
    e.pdvs.push(p);
  });
  var out = Object.keys(map).map(function(k){
    var e = map[k];
    var agg = makeAgg(e.u25, e.u26, e.r25, e.r26);
    agg.setor = e.setor;
    agg.pdvs = e.pdvs.slice().sort(function(a,b){return b.reais_proj-a.reais_proj;});
    return agg;
  });
  return out.sort(function(a,b){return b.reais_proj-a.reais_proj;});
}

// two-level drill-down for Ranking de Marcas: click a marca -> consolidated Setor rows;
// click a Setor row -> nested PDV breakdown for that setor (reuses pdvMiniTable).
// factory: 2nd level (consolidated Setor rows) -> 3rd level (PDV breakdown, via pdvMiniTable).
// finalOpts lets the caller hide whichever column is redundant with its own top-level grouping
// (e.g. Ranking PDV already groups by Bandeira, so the PDV list at the bottom hides it).
function nestedSetorPdvRenderer(finalOpts){
  finalOpts = finalOpts || {};
  return function(pdvRows, parentRow, expanded, parentRid){
    if(!pdvRows || !pdvRows.length){
      return '<div style="padding:4px 0;color:var(--text-secondary);font-size:12px">Nenhum PDV com venda encontrado para este recorte.</div>';
    }
    var pdvFilter = finalOpts.pdvFilterFn ? finalOpts.pdvFilterFn() : null;
    var tableId = parentRid+'_setorTable';
    var sortInfo = miniSortState(expanded, tableId, 'reais_proj', true);
    var allSetorRows = miniSortedRows(groupPdvBySetor(pdvRows), sortInfo);
    var setorRows = pdvFilter ? allSetorRows.filter(function(s){
      return s.pdvs.some(function(p){ return String(p.pdv||'').toLowerCase().indexOf(pdvFilter.toLowerCase())>-1; });
    }) : allSetorRows;
    if(pdvFilter && !setorRows.length){
      return '<div style="padding:4px 0;color:var(--text-secondary);font-size:12px">Nenhum PDV corresponde à busca "'+esc(pdvFilter)+'" neste recorte.</div>';
    }
    var countNote = setorRows.length+' setor(es) compõem este total (clique num setor para ver os PDVs; clique num cabeçalho para ordenar):';
    var html = '<div style="font-size:11.5px;color:var(--text-secondary);margin-bottom:4px">'+countNote+'</div>'+
      '<div class="tbl-wrap"><table class="dtable mini"><thead><tr>'+
      miniTh('Setor','setor',tableId,sortInfo)+
      miniTh(DATA.file_info.periodo_anterior+' Unid','unid_jun25',tableId,sortInfo)+
      miniTh(DATA.file_info.periodo_atual+' Unid ('+DATA.file_info.dias_coletados+'d)','unid_jun26',tableId,sortInfo)+
      miniTh(DATA.file_info.periodo_atual+' Unid (Proj)','unid_proj',tableId,sortInfo)+
      miniTh('Increm Unid','unid_increm',tableId,sortInfo)+
      miniTh('Evol %','unid_evol',tableId,sortInfo)+
      miniTh(DATA.file_info.periodo_anterior+' R$','reais_jun25',tableId,sortInfo)+
      miniTh(DATA.file_info.periodo_atual+' R$ ('+DATA.file_info.dias_coletados+'d)','reais_jun26',tableId,sortInfo)+
      miniTh(DATA.file_info.periodo_atual+' R$ (Proj)','reais_proj',tableId,sortInfo)+
      miniTh('Increm R$','reais_increm',tableId,sortInfo)+
      miniTh('Repres %','repres',tableId,sortInfo)+
      '</tr></thead><tbody>';
    setorRows.forEach(function(s){
      var subRid = parentRid+'_setor_'+String(s.setor).replace(/[^a-z0-9]/gi,'');
      if(pdvFilter) expanded[subRid] = true;
      var isOpen = !!expanded[subRid];
      var repres = (parentRow && parentRow.reais_proj) ? s.reais_proj/parentRow.reais_proj : null;
      html += '<tr>'+
        '<td style="text-align:left"><span class="expand-btn" data-rid="'+subRid+'">'+(isOpen?'▼':'▶')+'</span>'+esc(niceName(s.setor))+'</td>'+
        '<td>'+fmtInt(s.unid_jun25)+'</td>'+
        '<td>'+fmtInt(s.unid_jun26)+'</td>'+
        '<td>'+fmtInt(s.unid_proj)+'</td>'+
        '<td><span class="'+signClass(s.unid_increm)+'">'+fmtSignedInt(s.unid_increm)+'</span></td>'+
        '<td>'+(s.unid_evol==null?'-':'<span class="'+signClass(s.unid_evol)+'">'+fmtPct(s.unid_evol)+'</span>')+'</td>'+
        '<td>'+fmtBRL(s.reais_jun25)+'</td>'+
        '<td>'+fmtBRL(s.reais_jun26)+'</td>'+
        '<td>'+fmtBRL(s.reais_proj)+'</td>'+
        '<td><span class="'+signClass(s.reais_increm)+'">'+fmtSignedBRL(s.reais_increm)+'</span></td>'+
        '<td>'+(repres==null?'-':fmtPct(repres))+'</td>'+
        '</tr>';
      if(isOpen){
        html += '<tr><td colspan="11" style="background:var(--surface-2);padding:6px 6px 10px 24px">'+
          pdvMiniTable(s.pdvs, Object.assign({showSetor:false}, finalOpts), expanded, subRid+'_pdvTable') +
          '</td></tr>';
      }
    });
    html += '</tbody></table></div>';
    return html;
  };
}
var marcaSetorPdvRenderer = nestedSetorPdvRenderer({});

// ================= app state =================
var currentSetor = 'Todos';

function filterNote(){
  if(currentSetor==='Todos') return '';
  return ' <span class="badge">Filtrado: '+esc(niceName(currentSetor))+'</span>';
}

// ================= build: KPI + Visão Geral =================
function buildVisaoGeral(){
  var el = document.getElementById('panel-visao');
  var setorIdx = setorIdxOf(currentSetor);
  var allSetores = DATA.setores;
  var tot = currentSetor==='Todos' ? DATA.total_setor : allSetores.find(function(s){return s.setor===currentSetor;});
  var setores = currentSetor==='Todos' ? allSetores : allSetores.filter(function(s){return s.setor===currentSetor;});
  el.innerHTML = '';

  var kpiWrap = document.createElement('div');
  kpiWrap.innerHTML = '<h2 class="h">Indicadores gerais &mdash; '+DATA.file_info.periodo_anterior+' &rarr; '+DATA.file_info.periodo_atual+filterNote()+'</h2>'+
    '<p class="desc">Totais do Distrital 1880, consolidando as 8 áreas (setores) de venda. Fonte: planilha mensal (QUERY). '+DATA.file_info.periodo_atual+' está com apenas '+DATA.file_info.dias_coletados+' dias de coleta &mdash; a evolução abaixo compara a <b>projeção do mês cheio</b> ('+DATA.file_info.dias_coletados+' dias &times; '+DATA.file_info.dias_mes+'/'+DATA.file_info.dias_coletados+') contra '+DATA.file_info.periodo_anterior+'.</p>'+
    '<div class="grid-kpi" id="kpiGrid"></div>';
  el.appendChild(kpiWrap);
  var grid = kpiWrap.querySelector('#kpiGrid');

  function tile(label, value, delta, deltaLabel, isPct){
    var d = document.createElement('div'); d.className='tile';
    d.innerHTML = '<div class="label">'+label+'</div><div class="value">'+value+'</div>'+
      (delta!=null?('<div class="delta '+(delta>=0?'up':'down')+'">'+(delta>=0?'▲':'▼')+' '+ (isPct? fmtPct(Math.abs(delta)) : (delta>=0?'+':'')+fmtInt(delta)) +' '+deltaLabel+'</div>'):'');
    return d;
  }
  grid.appendChild(tile('Projeção Unidades '+DATA.file_info.periodo_atual, fmtInt(tot.unid_proj), tot.unid_evol, 'vs '+DATA.file_info.periodo_anterior, true));
  grid.appendChild(tile('Projeção Faturamento '+DATA.file_info.periodo_atual, fmtBRL(tot.reais_proj), tot.reais_evol, 'vs '+DATA.file_info.periodo_anterior, true));
  grid.appendChild(tile('Unidades '+DATA.file_info.periodo_atual+' (parcial, '+DATA.file_info.dias_coletados+'d)', fmtInt(tot.unid_jun26), null));
  grid.appendChild(tile('Faturamento '+DATA.file_info.periodo_atual+' (parcial, '+DATA.file_info.dias_coletados+'d)', fmtBRL(tot.reais_jun26), null));
  grid.appendChild(tile('Bricks '+(setorIdx!=null?'do setor':'cobertos'), fmtInt(distinctCount('Brick', setorIdx)), null));
  grid.appendChild(tile('Marcas '+(setorIdx!=null?'com venda':'no portfólio'), fmtInt(distinctCount('Marca', setorIdx)), null));
  grid.appendChild(tile(setorIdx!=null?'PDVs com venda':'PDVs cadastrados', fmtInt(setorIdx!=null?distinctCount('PDV', setorIdx):DATA.meta.n_pdvs), null));

// "Todas as redes" table for Ranking PDV: like buildTable, but with two independent
// search boxes side by side (Rede and PDV/CNPJ) instead of buildTable's single searchable box.
// A PDV/CNPJ match auto-expands the matching Rede -> Setor rows and filters the PDV list
// at the bottom to only the matching store(s), since most PDV codes embed the CNPJ as a
// 14-digit suffix (e.g. "DROGARIA PACHECO - 33438250018880").
function buildRankingPdvTable(rows, opts){
  opts = opts || {};
  var box = document.createElement('div');
  var redeVal = '', pdvVal = '';
  var sortKey = 'reais_proj', sortDesc = true;
  var expanded = {};
  var focusField = null; // 'rede' | 'pdv' | null -- which search box to refocus after the next render
  var columns = [
    {key:'bandeira', label:'Rede (Bandeira)', fmt:function(v){return esc(v);}},
    {key:'unid_jun25', label:DATA.file_info.periodo_anterior+' Unid', fmt:fmtInt},
    {key:'unid_jun26', label:DATA.file_info.periodo_atual+' Unid ('+DATA.file_info.dias_coletados+'d)', fmt:fmtInt},
    {key:'unid_proj', label:DATA.file_info.periodo_atual+' Unid (Proj)', fmt:fmtInt},
    {key:'unid_increm', label:'Increm Unid', fmt:function(v){return '<span class="'+signClass(v)+'">'+fmtSignedInt(v)+'</span>';}},
    {key:'unid_evol', label:'Evol % Unid', fmt:function(v){return v==null?'-':'<span class="'+signClass(v)+'">'+fmtPct(v)+'</span>';}},
    {key:'reais_jun25', label:DATA.file_info.periodo_anterior+' R$', fmt:fmtBRL},
    {key:'reais_jun26', label:DATA.file_info.periodo_atual+' R$ ('+DATA.file_info.dias_coletados+'d)', fmt:fmtBRL},
    {key:'reais_proj', label:DATA.file_info.periodo_atual+' R$ (Proj)', fmt:fmtBRL},
    {key:'reais_increm', label:'Increm R$', fmt:function(v){return '<span class="'+signClass(v)+'">'+fmtSignedBRL(v)+'</span>';}},
    {key:'repres', label:'Repres %', fmt:fmtPct},
  ];
  var childRenderer = nestedSetorPdvRenderer({showBandeira:false, pdvFilterFn:function(){return pdvVal;}});

  function rowMatchesRede(row){
    if(!redeVal) return true;
    return String(row.bandeira||'').toLowerCase().indexOf(redeVal.toLowerCase())>-1;
  }
  function rowMatchesPdv(row){
    if(!pdvVal) return true;
    var needle = pdvVal.toLowerCase();
    return (row.pdvs||[]).some(function(p){ return String(p.pdv||'').toLowerCase().indexOf(needle)>-1; });
  }

  function render(){
    var sorted = rows.slice();
    sorted.sort(function(a,b){
      var av=a[sortKey], bv=b[sortKey];
      if(av==null) av=-Infinity; if(bv==null) bv=-Infinity;
      if(typeof av==='string') return sortDesc? String(bv).localeCompare(av) : String(av).localeCompare(bv);
      return sortDesc? (bv-av) : (av-bv);
    });
    var visRows = sorted.filter(function(r){ return rowMatchesRede(r) && rowMatchesPdv(r); });

    var html = '<div class="tbl-wrap"><table class="dtable"><thead><tr>';
    columns.forEach(function(c){
      html += '<th data-k="'+c.key+'" class="'+(sortKey===c.key?'sorted':'')+'">'+esc(c.label)+(sortKey===c.key?(sortDesc?' ▼':' ▲'):'')+'</th>';
    });
    html += '</tr></thead><tbody>';
    visRows.forEach(function(row, idx){
      var hasChildren = row.pdvs && row.pdvs.length;
      var rid = 'r'+idx+'_'+(row.bandeira||'').replace(/[^a-z0-9]/gi,'');
      if(pdvVal && hasChildren && rowMatchesPdv(row)) expanded[rid] = true;
      var isOpen = !!expanded[rid];
      html += '<tr>';
      columns.forEach(function(c,ci){
        var v = row[c.key];
        var content = c.fmt ? c.fmt(v,row) : esc(v);
        if(ci===0 && hasChildren){
          content = '<span class="expand-btn" data-rid="'+rid+'">'+(isOpen?'▼':'▶')+'</span>'+content;
        } else if(ci===0){
          content = '<span style="display:inline-block;width:18px"></span>'+content;
        }
        html += '<td>'+content+'</td>';
      });
      html += '</tr>';
      if(hasChildren && isOpen){
        html += '<tr class="child-detail"><td colspan="'+columns.length+'">'+childRenderer(row.pdvs, row, expanded, rid)+'</td></tr>';
      }
    });
    if(opts.totalRow){
      html += '<tr class="total">';
      columns.forEach(function(c){
        var v = opts.totalRow[c.key];
        html += '<td>'+(c.fmt?c.fmt(v,opts.totalRow):esc(v))+'</td>';
      });
      html += '</tr>';
    }
    html += '</tbody></table></div>';

    box.innerHTML = '<div class="searchbar" style="flex-wrap:wrap">'+
      '<input type="search" placeholder="Buscar rede..." id="redeSearch" value="'+esc(redeVal)+'" style="min-width:200px">'+
      '<input type="search" placeholder="Buscar PDV / CNPJ..." id="pdvCodeSearch" value="'+esc(pdvVal)+'" style="min-width:220px">'+
      '<span class="badge">'+visRows.length+' de '+rows.length+'</span>'+
      '</div>'+html;

    var redeInp = box.querySelector('#redeSearch');
    var pdvInp = box.querySelector('#pdvCodeSearch');
    if(focusField==='rede'){ redeInp.focus(); redeInp.setSelectionRange(redeInp.value.length, redeInp.value.length); }
    else if(focusField==='pdv'){ pdvInp.focus(); pdvInp.setSelectionRange(pdvInp.value.length, pdvInp.value.length); }
    redeInp.addEventListener('input', function(){ redeVal = redeInp.value; focusField='rede'; render(); });
    pdvInp.addEventListener('input', function(){ pdvVal = pdvInp.value; focusField='pdv'; render(); });

    box.querySelectorAll('th[data-k]').forEach(function(th){
      th.addEventListener('click', function(){
        var k = th.getAttribute('data-k');
        if(sortKey===k) sortDesc=!sortDesc; else { sortKey=k; sortDesc=true; }
        render();
      });
    });
    box.querySelectorAll('.expand-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var rid = btn.getAttribute('data-rid');
        expanded[rid] = !expanded[rid];
        render();
      });
    });
    box.querySelectorAll('th[data-sk]').forEach(function(th){
      th.addEventListener('click', function(e){
        e.stopPropagation();
        var tid = th.getAttribute('data-st'), k = th.getAttribute('data-sk');
        var skey = 'sort:'+tid;
        var cur = expanded[skey] || {};
        if(cur.key===k) cur.desc = !cur.desc; else { cur = {key:k, desc:true}; }
        expanded[skey] = cur;
        render();
      });
    });
  }
  render();
  return box;
}

// ================= período (YTD / Trimestre) — dados mensais em Reais, a partir da planilha mensal =================
// DATA.monthly_setor_marca / monthly_setor_bandeira: [{s:setorIdx, k:dimIdx, v:[32 valores]}]
// v: 16 valores de 2025 (Jan..Ago, Real/Unidade intercalados) seguidos de 16 valores de 2026 (idem).
var MONTH_PT = {1:'Jan',2:'Fev',3:'Mar',4:'Abr',5:'Mai',6:'Jun',7:'Jul',8:'Ago'};
var MONTHS_PER_YEAR = 8; // Jan..Ago
var LAST_MONTH_NUM = 8; // Agosto -- o mês parcial/projetado desta base

function sumMonths(v, months, year, applyProj){
  var y = year===25 ? 0 : 1;
  var r=0, u=0;
  months.forEach(function(m){
    var ridx = y*MONTHS_PER_YEAR*2 + (m-1)*2, uidx = ridx+1;
    var rv = v[ridx]||0, uv = v[uidx]||0;
    if(applyProj && year===26 && m===LAST_MONTH_NUM){ rv*=PROJ_FACTOR; uv*=PROJ_FACTOR; }
    r += rv; u += uv;
  });
  return {reais:r, unid:u};
}

function buildPeriodTab(elId, cfg){
  // cfg: {months:[1..8], applyProj:bool, tituloPeriodo, descricao, notaProjecao}
  var el = document.getElementById(elId);
  var setorIdx = setorIdxOf(currentSetor);
  var dataset = DATA.monthly_setor_marca;

  var overall25={reais:0,unid:0}, overall26={reais:0,unid:0}, overall26raw={reais:0,unid:0};
  var bySetor = {}, byMarca = {};
  dataset.forEach(function(row){
    if(setorIdx!=null && row.s!==setorIdx) return;
    var s25 = sumMonths(row.v, cfg.months, 25, cfg.applyProj);
    var s26 = sumMonths(row.v, cfg.months, 26, cfg.applyProj);
    // s26raw: mesma soma do período, mas sem aplicar o fator de projeção no mês parcial --
    // ou seja, o dado bruto (dias coletados) tal como está na planilha. Igual a s26 quando
    // cfg.applyProj é falso (período sem mês parcial, ex.: Trimestre Abr-Mai-Jun).
    var s26raw = cfg.applyProj ? sumMonths(row.v, cfg.months, 26, false) : s26;
    overall25.reais+=s25.reais; overall25.unid+=s25.unid;
    overall26.reais+=s26.reais; overall26.unid+=s26.unid;
    overall26raw.reais+=s26raw.reais; overall26raw.unid+=s26raw.unid;
    if(!bySetor[row.s]) bySetor[row.s]={reais25:0,unid25:0,reais26:0,unid26:0,reais26raw:0,unid26raw:0};
    bySetor[row.s].reais25+=s25.reais; bySetor[row.s].unid25+=s25.unid;
    bySetor[row.s].reais26+=s26.reais; bySetor[row.s].unid26+=s26.unid;
    bySetor[row.s].reais26raw+=s26raw.reais; bySetor[row.s].unid26raw+=s26raw.unid;
    if(!byMarca[row.k]) byMarca[row.k]={reais25:0,unid25:0,reais26:0,unid26:0,reais26raw:0,unid26raw:0};
    byMarca[row.k].reais25+=s25.reais; byMarca[row.k].unid25+=s25.unid;
    byMarca[row.k].reais26+=s26.reais; byMarca[row.k].unid26+=s26.unid;
    byMarca[row.k].reais26raw+=s26raw.reais; byMarca[row.k].unid26raw+=s26raw.unid;
  });

  function withDelta(o){
    return Object.assign({}, o, {
      increm: round2(o.reais26-o.reais25),
      evol: o.reais25 ? (o.reais26-o.reais25)/o.reais25 : null,
      unid_increm: Math.round(o.unid26-o.unid25),
      unid_evol: o.unid25 ? (o.unid26-o.unid25)/o.unid25 : null,
    });
  }
  var setorRows = Object.keys(bySetor).map(function(k){
    var o = withDelta(bySetor[k]);
    o.setor = DATA.dims.Setor[k];
    o.repres = overall26.reais ? o.reais26/overall26.reais : null;
    return o;
  });
  var marcaRows = Object.keys(byMarca).map(function(k){
    var o = withDelta(byMarca[k]);
    o.marca = DATA.dims.Marca[k];
    o.repres = overall26.reais ? o.reais26/overall26.reais : null;
    return o;
  });

  var monthlyTrend = cfg.months.map(function(m){
    var r25=0,r26=0;
    dataset.forEach(function(row){
      if(setorIdx!=null && row.s!==setorIdx) return;
      var i25=(m-1)*2, i26=MONTHS_PER_YEAR*2+(m-1)*2;
      r25 += row.v[i25]||0;
      r26 += row.v[i26]||0;
    });
    var isProjected = cfg.applyProj && m===LAST_MONTH_NUM;
    return {
      label: MONTH_PT[m]+'/25 vs '+MONTH_PT[m]+'/26', month:m, r25:r25,
      r26_parcial: r26,
      r26: isProjected ? r26*PROJ_FACTOR : r26,
      isProjected: isProjected
    };
  });

  var overallEvol = overall25.reais ? (overall26.reais-overall25.reais)/overall25.reais : null;
  var lastMonthLabel = MONTH_PT[cfg.months[cfg.months.length-1]];

  el.innerHTML = '';
  var kpiWrap = document.createElement('div');
  kpiWrap.innerHTML = '<h2 class="h">'+cfg.tituloPeriodo+filterNote()+'</h2>'+
    '<p class="desc">'+cfg.descricao+' Fonte: planilha mensal (QUERY), mesma base de PDV × Marca × Brick do restante do dashboard, com histórico mês a mês.'+(cfg.notaProjecao?(' '+cfg.notaProjecao):'')+'</p>'+
    '<div class="grid-kpi" id="kpiGrid'+elId+'"></div>';
  el.appendChild(kpiWrap);
  var grid = kpiWrap.querySelector('#kpiGrid'+elId);
  function tile(label, value, delta, deltaLabel){
    var d = document.createElement('div'); d.className='tile';
    d.innerHTML = '<div class="label">'+label+'</div><div class="value">'+value+'</div>'+
      (delta!=null?('<div class="delta '+(delta>=0?'up':'down')+'">'+(delta>=0?'▲':'▼')+' '+fmtPct(Math.abs(delta))+' '+deltaLabel+'</div>'):'');
    return d;
  }
  grid.appendChild(tile(cfg.tituloPeriodo+' 2026 (R$)', fmtBRL(overall26.reais), overallEvol, 'vs '+cfg.tituloPeriodo+' 2025'));
  grid.appendChild(tile(cfg.tituloPeriodo+' 2025 (R$)', fmtBRL(overall25.reais), null));
  grid.appendChild(tile('Incremento (R$)', fmtSignedBRL(overall26.reais-overall25.reais), null));
  grid.appendChild(tile('Unidades '+cfg.tituloPeriodo+' 2026', fmtInt(overall26.unid), overall25.unid?(overall26.unid-overall25.unid)/overall25.unid:null, 'vs 2025'));

  var card = document.createElement('div'); card.className='card';
  card.innerHTML = '<h2 class="h" style="margin-top:0">Faturamento mensal &mdash; 2025 vs 2026</h2>'+
    '<div class="legend"><span><span class="sw" style="background:var(--baseline)"></span>2025</span><span><span class="sw" style="background:var(--s2)"></span>2026'+(cfg.applyProj?' ('+MONTH_PT[LAST_MONTH_NUM]+' projetado)':'')+'</span></div>';
  card.appendChild(hGroupedBar(monthlyTrend.map(function(t){return {label:MONTH_PT[t.month], v1:t.r25, v2:t.r26};}),
    {formatter:fmtBRL, colorA:'var(--baseline)', colorB:'var(--s2)', labelA:'2025', labelB:'2026'+(cfg.applyProj?' ('+MONTH_PT[LAST_MONTH_NUM]+' projetado)':''), labelW:90}));
  el.appendChild(card);

  var cardMonthly = document.createElement('div'); cardMonthly.className='card';
  cardMonthly.innerHTML = '<h2 class="h" style="margin-top:0">Detalhamento mensal</h2>'+
    (cfg.applyProj ? '<p class="desc">A linha de '+MONTH_PT[LAST_MONTH_NUM]+'/26 mostra o valor parcial ('+DATA.file_info.dias_coletados+' dias) coletado e, ao lado, a projeção do mês cheio (&times;'+DATA.file_info.dias_mes+'/'+DATA.file_info.dias_coletados+') que entra na soma do '+cfg.tituloPeriodo+'.</p>' : '');
  cardMonthly.appendChild(buildTable({
    columns: [
      {key:'mes', label:'Mês', fmt:function(v){return esc(v);}},
      {key:'r25', label:'2025', fmt:fmtBRL},
    ].concat(cfg.applyProj ? [
      {key:'r26_parcial', label:DATA.file_info.periodo_atual+' ('+DATA.file_info.dias_coletados+'d)', fmt:function(v,row){return row.isProjected ? fmtBRL(v) : '—';}},
    ] : []).concat([
      {key:'r26', label:'2026 usado no '+(cfg.applyProj?'acumulado':'total'), fmt:function(v,row){return row.isProjected ? ('<b>'+fmtBRL(v)+'</b> <span class="badge">projetado</span>') : fmtBRL(v);}},
    ]),
    rows: monthlyTrend.map(function(t){ return Object.assign({}, t, {mes: MONTH_PT[t.month]}); })
  }));
  el.appendChild(cardMonthly);

  // Unid/Reais column pair, shared by "Por Setor" and "Todas as marcas": quando o período
  // inclui o mês parcial (cfg.applyProj), insere a coluna bruta (dias coletados) antes da
  // coluna projetada; caso contrário (ex.: Trimestre Abr-Mai-Jun) mostra só o valor fechado.
  function unidReaisCols(){
    var u = [{key:'unid25', label:cfg.tituloPeriodo+' 2025 Unid', fmt:fmtInt}];
    if(cfg.applyProj) u.push({key:'unid26raw', label:cfg.tituloPeriodo+' 2026 Unid ('+DATA.file_info.dias_coletados+'d)', fmt:fmtInt});
    u.push({key:'unid26', label:cfg.tituloPeriodo+' 2026 Unid'+(cfg.applyProj?' (Proj)':''), fmt:fmtInt});
    u.push({key:'unid_increm', label:'Increm Unid', fmt:function(v){return '<span class="'+signClass(v)+'">'+fmtSignedInt(v)+'</span>';}});
    u.push({key:'unid_evol', label:'Evol % Unid', fmt:function(v){return v==null?'-':'<span class="'+signClass(v)+'">'+fmtPct(v)+'</span>';}});
    var r = [{key:'reais25', label:cfg.tituloPeriodo+' 2025 R$', fmt:fmtBRL}];
    if(cfg.applyProj) r.push({key:'reais26raw', label:cfg.tituloPeriodo+' 2026 R$ ('+DATA.file_info.dias_coletados+'d)', fmt:fmtBRL});
    r.push({key:'reais26', label:cfg.tituloPeriodo+' 2026 R$'+(cfg.applyProj?' (Proj)':''), fmt:fmtBRL});
    r.push({key:'increm', label:'Increm R$', fmt:function(v){return '<span class="'+signClass(v)+'">'+fmtSignedBRL(v)+'</span>';}});
    r.push({key:'evol', label:'Evol % R$', fmt:function(v){return v==null?'-':'<span class="'+signClass(v)+'">'+fmtPct(v)+'</span>';}});
    return u.concat(r);
  }

  var card2 = document.createElement('div'); card2.className='card';
  card2.innerHTML = '<h2 class="h" style="margin-top:0">Por Setor</h2>';
  card2.appendChild(buildTable({
    columns: [{key:'setor', label:'Setor', fmt:function(v){return esc(niceName(v));}}].concat(unidReaisCols()).concat([{key:'repres', label:'Repres %', fmt:fmtPct}]),
    rows: setorRows.sort(function(a,b){return b.reais26-a.reais26;}),
    totalRow: Object.assign({setor:'Total'}, withDelta({reais25:overall25.reais,unid25:overall25.unid,reais26:overall26.reais,unid26:overall26.unid,reais26raw:overall26raw.reais,unid26raw:overall26raw.unid}), {repres:1})
  }));
  el.appendChild(card2);

  var sortedMarcas = marcaRows.slice().sort(function(a,b){return a.increm-b.increm;});
  var worst = sortedMarcas.slice(0,10).map(function(m){return {label:niceName(m.marca), value:m.increm};});
  var best = sortedMarcas.slice(-10).reverse().map(function(m){return {label:niceName(m.marca), value:m.increm};});
  var card3 = document.createElement('div'); card3.className='card';
  card3.innerHTML = '<h2 class="h" style="margin-top:0">Marcas com maior variação de faturamento ('+cfg.tituloPeriodo+')</h2>';
  var row2 = document.createElement('div'); row2.className='row2';
  var c1=document.createElement('div'); c1.innerHTML='<div style="font-size:12.5px;color:var(--text-secondary);margin-bottom:6px">10 marcas em maior queda</div>';
  c1.appendChild(signBar(worst,{formatter:fmtSignedBRL, color:'var(--s8)'}));
  var c2=document.createElement('div'); c2.innerHTML='<div style="font-size:12.5px;color:var(--text-secondary);margin-bottom:6px">10 marcas em maior crescimento</div>';
  c2.appendChild(signBar(best,{formatter:fmtSignedBRL, color:'var(--s1)'}));
  row2.appendChild(c1); row2.appendChild(c2);
  card3.appendChild(row2);
  el.appendChild(card3);

  var card4 = document.createElement('div'); card4.className='card';
  card4.innerHTML = '<h2 class="h" style="margin-top:0">Todas as marcas</h2>';
  card4.appendChild(buildTable({
    columns: [{key:'marca', label:'Marca', fmt:function(v){return esc(niceName(v));}}].concat(unidReaisCols()).concat([{key:'repres', label:'Repres %', fmt:fmtPct}]),
    rows: marcaRows, searchable:true, defaultSortKey:'reais26'
  }));
  el.appendChild(card4);
}

// ================= build: Análise Estratégica =================
function actionForMarca(evol, repres){
  var represTxt = repres!=null ? ' ('+fmtPct(repres)+' do faturamento do recorte)' : '';
  if(evol==null) return 'Marca nova/sem histórico &mdash; monitorar entrada no sortimento.';
  if(evol < -0.15) return 'Queda expressiva'+represTxt+': ação prioritária (visita + checagem de ruptura/concorrência).';
  if(evol < 0) return 'Leve queda'+represTxt+': acompanhar evolução no próximo ciclo.';
  if(evol > 0.2) return 'Forte crescimento'+represTxt+': reforçar disponibilidade e replicar abordagem em outros bricks.';
  return 'Performance estável'+represTxt+'.';
}
function actionForBrick(evol){
  if(evol==null) return 'Sem histórico suficiente.';
  if(evol < -0.15) return 'Queda acentuada no brick: visita prioritária, investigar ruptura de estoque/concorrência local.';
  if(evol < 0) return 'Queda moderada: incluir no roteiro de acompanhamento do setor.';
  if(evol > 0.2) return 'Forte crescimento: mapear o que está funcionando e replicar em bricks vizinhos.';
  return 'Performance estável.';
}

function buildEstrategia(){
  var el = document.getElementById('panel-estrategia');
  var setorIdx = setorIdxOf(currentSetor);
  var tot = currentSetor==='Todos' ? DATA.total_setor : DATA.setores.find(function(s){return s.setor===currentSetor;});

  var marcaAgg = aggregateBy('Marca', setorIdx).filter(function(m){return m.unid_jun25>=10;});
  var marcasPrioritarias = marcaAgg.slice().sort(function(a,b){return a.reais_increm-b.reais_increm;}).slice(0,10);
  var marcasDestaque = marcaAgg.slice().sort(function(a,b){return b.reais_increm-a.reais_increm;}).slice(0,8);

  var brickAgg = aggregateBy('Brick', setorIdx).filter(function(b){return b.unid_jun25>=15;});
  var bricksCriticos = brickAgg.slice().sort(function(a,b){return (a.unid_evol==null?0:a.unid_evol)-(b.unid_evol==null?0:b.unid_evol);}).slice(0,12);

  el.innerHTML = '<h2 class="h">Análise Estratégica'+filterNote()+'</h2>'+
    '<p class="desc">Gerado automaticamente a partir dos dados consolidados (Setor, Marca e Brick). Use como ponto de partida &mdash; combine com o seu conhecimento do território antes de agir.</p>';

  var cardBrick = document.createElement('div'); cardBrick.className='card';
  cardBrick.innerHTML = '<h2 class="h" style="margin-top:0">Bricks que mais precisam de atenção</h2><p class="desc">Bricks com pelo menos 15 unidades em '+DATA.file_info.periodo_anterior+', ordenados pela pior evolução. Ver combinações específicas de marca em cada brick na aba "Decremento por Brick".</p>';
  var tblBrick = buildTable({
    columns:[
      {key:'key', label:'Brick', fmt:function(v){return esc(niceName(v));}},
      {key:'setor', label:'Setor', fmt:function(v){return esc(niceName(v));}},
      {key:'unid_jun25', label:DATA.file_info.periodo_anterior+' Unid', fmt:fmtInt},
      {key:'unid_evol', label:'Evol %', fmt:function(v){return '<span class="'+signClass(v)+'">'+fmtPct(v)+'</span>';}},
      {key:'reais_increm', label:'Increm R$', fmt:function(v){return '<span class="'+signClass(v)+'">'+fmtSignedBRL(v)+'</span>';}},
      {key:'acao', label:'Ação sugerida', fmt:function(v){return '<span style="white-space:normal;display:block;max-width:340px;text-align:left">'+esc(v)+'</span>';}},
    ],
    rows: bricksCriticos.map(function(b){
      return Object.assign({}, b, {setor: setorOfBrick(b.key), acao: actionForBrick(b.unid_evol)});
    }),
    searchable:true, defaultSortKey:'unid_evol', defaultSortDesc:false
  });
  cardBrick.appendChild(tblBrick);
  el.appendChild(cardBrick);

  var row2 = document.createElement('div'); row2.className='row2';
  var cardMarcaP = document.createElement('div'); cardMarcaP.className='card';
  cardMarcaP.innerHTML = '<h2 class="h" style="margin-top:0">Marcas prioritárias</h2><p class="desc">Maior risco de faturamento (marcas com pelo menos 10 unidades em '+DATA.file_info.periodo_anterior+').</p>';
  var tblMarcaP = buildTable({
    columns:[
      {key:'key', label:'Marca', fmt:function(v){return esc(niceName(v));}},
      {key:'unid_evol', label:'Evol %', fmt:function(v){return '<span class="'+signClass(v)+'">'+fmtPct(v)+'</span>';}},
      {key:'reais_increm', label:'Increm R$', fmt:function(v){return '<span class="'+signClass(v)+'">'+fmtSignedBRL(v)+'</span>';}},
      {key:'acao', label:'Ação sugerida', fmt:function(v){return '<span style="white-space:normal;display:block;max-width:260px;text-align:left">'+esc(v)+'</span>';}},
    ],
    rows: marcasPrioritarias.map(function(m){ return Object.assign({}, m, {acao: actionForMarca(m.unid_evol, m.reais_jun25 ? m.reais_proj/tot.reais_proj : null)}); }),
    defaultSortKey:'reais_increm', defaultSortDesc:false
  });
  cardMarcaP.appendChild(tblMarcaP);
  row2.appendChild(cardMarcaP);

  var cardMarcaD = document.createElement('div'); cardMarcaD.className='card';
  cardMarcaD.innerHTML = '<h2 class="h" style="margin-top:0">Marcas em destaque</h2><p class="desc">Maior contribuição positiva &mdash; oportunidades para reforçar.</p>';
  var tblMarcaD = buildTable({
    columns:[
      {key:'key', label:'Marca', fmt:function(v){return esc(niceName(v));}},
      {key:'unid_evol', label:'Evol %', fmt:function(v){return '<span class="'+signClass(v)+'">'+fmtPct(v)+'</span>';}},
      {key:'reais_increm', label:'Increm R$', fmt:function(v){return '<span class="'+signClass(v)+'">'+fmtSignedBRL(v)+'</span>';}},
      {key:'acao', label:'Ação sugerida', fmt:function(v){return '<span style="white-space:normal;display:block;max-width:260px;text-align:left">'+esc(v)+'</span>';}},
    ],
    rows: marcasDestaque.map(function(m){ return Object.assign({}, m, {acao: actionForMarca(m.unid_evol, m.reais_jun25 ? m.reais_proj/tot.reais_proj : null)}); }),
    defaultSortKey:'reais_increm'
  });
  cardMarcaD.appendChild(tblMarcaD);
  row2.appendChild(cardMarcaD);
  el.appendChild(row2);
}

// ================= build: metodologia =================
function buildMetodologia(){
  var el = document.getElementById('panel-metodologia');
  el.innerHTML = '<h2 class="h">Metodologia e notas de leitura</h2>'+
    '<div class="note"><b>Arquivo de origem:</b> '+esc(DATA.file_info.nome_arquivo)+'<br>'+
    '<b>Distrital:</b> '+esc(niceName(DATA.file_info.distrital))+' (código '+esc(DATA.file_info.distrital.split(' - ')[0])+')<br>'+
    '<b>Abas consideradas:</b> aba <b>QUERY</b> da planilha mensal (01MDTR_MENSAL), linha a linha, para todas as abas do dashboard (Visão Geral, Ranking de Marcas, Ranking de PDV, Decremento por Brick, Outras Dimensões, Trimestre (Jun-Ago), YTD, Trimestre (Abr-Jun) e Análise Estratégica).</div>'+
    '<div class="note"><b>Projeção de '+DATA.file_info.periodo_atual+' (mês parcial):</b> a planilha mensal mais recente chegou com apenas <b>'+DATA.file_info.dias_coletados+' dias de coleta</b> em '+DATA.file_info.periodo_atual+'. Para permitir uma leitura de "indicadores gerais" comparável a um mês fechado, todas as abas deste dashboard que incluem Agosto (Visão Geral, Ranking de Marcas, Ranking de PDV, Decremento por Brick, Outras Dimensões, Trimestre (Jun-Ago), YTD e Análise Estratégica) aplicam o mesmo fator de projeção do mês cheio sobre o valor parcial coletado: <b>parcial &times; '+DATA.file_info.dias_mes+'/'+DATA.file_info.dias_coletados+'</b> (&asymp; &times;'+(Math.round(DATA.file_info.proj_factor*100)/100)+'). Os valores de '+DATA.file_info.periodo_anterior+' não sofrem nenhum ajuste (mês já fechado); as colunas "Increm"/"Evol %" comparam a projeção de '+DATA.file_info.periodo_atual+' contra o real de '+DATA.file_info.periodo_anterior+'. A aba Trimestre (Abr-Mai-Jun) não é afetada, pois não inclui Agosto.</div>'+
    '<div class="note"><b>Visão Geral, Ranking de Marcas, Ranking de PDV e Decremento por Brick:</b> recalculados diretamente da aba QUERY, linha a linha, tanto para "Todos os setores" quanto para um setor específico &mdash; não dependem mais de tabelas dinâmicas pré-calculadas do Excel, o que também elimina qualquer inconsistência de detalhamento por setor entre o total geral e a visão filtrada.</div>'+
    '<div class="note"><b>Filtro de Setor:</b> o seletor no topo da página recalcula, na hora, todas as abas deste dashboard a partir dos dados linha a linha da aba QUERY, sem exceção.</div>'+
    '<div class="note"><b>Trimestre (Jun-Ago):</b> substitui a antiga aba "Mapa Trimestral" (que usava a aba MAPA TRI do arquivo de auditoria original e comparava Ago&ndash;Set&ndash;Out/24 x Ago&ndash;Set&ndash;Out/25, um período desalinhado do restante do dashboard). Agora compara Junho, Julho e Agosto de 2025 com o mesmo trimestre de 2026 &mdash; Agosto/26 projetado como em todas as demais abas &mdash; usando a mesma base QUERY.</div>'+
    '<div class="note"><b>Aba MARCAS EM DECREMENTO POR BRICK:</b> a tabela dinâmica original dessa aba estava configurada com quebra por Setor, não por Marca/Brick como o nome sugere. Para entregar a análise pretendida, este dashboard recalcula o decremento por Brick × Marca diretamente da aba QUERY (ver aba "Decremento por Brick").</div>'+
    '<div class="note"><b>Análise Estratégica:</b> as "ações sugeridas" para Bricks e Marcas são heurísticas simples baseadas nos limiares de evolução % e materialidade (representatividade no faturamento), geradas automaticamente a partir dos dados. Servem como ponto de partida para priorização, não substituem o conhecimento do gestor sobre o território.</div>'+
    '<div class="note"><b>Universo x vendas:</b> a planilha mensal cadastra '+fmtInt(DATA.meta.total_rows)+' combinações Brick × PDV × Marca (o universo potencial de venda do distrital); '+fmtInt(DATA.meta.rows_with_sales)+' delas registraram alguma venda (unidades ou reais) no período analisado. Contagens de "Bricks", "Marcas", "PDVs" e "Redes" nos indicadores gerais refletem apenas os que tiveram venda no período.</div>'+
    '<div class="note"><b>Privacidade:</b> este arquivo HTML é autocontido (dados, estilos e código embutidos) e não faz nenhuma chamada de rede — pode ser aberto direto do disco, sem internet, e enviado por e-mail ou pendrive com segurança.</div>'+
    '<div class="note"><b>Gerado em:</b> '+esc(DATA.file_info.gerado_em||'')+'</div>';
}

// ================= tabs / nav =================
var TABS = [
  {id:'visao', label:'Visão Geral', build:buildVisaoGeral},
  {id:'marcas', label:'Ranking Marcas', build:buildRankingMarcas},
  {id:'pdv', label:'Ranking PDV', build:buildRankingPdv},
  {id:'tri', label:'Trimestre (Jun-Ago)', build:buildTrimestreJunAgo},
  {id:'brick', label:'Decremento por Brick', build:buildBrick},
  {id:'outras', label:'Outras Dimensões', build:buildOutras},
  {id:'ytd', label:'YTD (Jan-Ago)', build:buildYTD},
  {id:'trimestre', label:'Trimestre (Abr-Jun)', build:buildTrimestre},
  {id:'estrategia', label:'Análise Estratégica', build:buildEstrategia},
  {id:'metodologia', label:'Metodologia', build:buildMetodologia},
];

function rebuildActive(){
  TABS.forEach(function(t){ t.build(); });
}

function initTabs(){
  var nav = document.getElementById('tabs');
  TABS.forEach(function(t,i){
    var b = document.createElement('button');
    b.textContent = t.label;
    b.dataset.id = t.id;
    if(i===0) b.className='active';
    b.addEventListener('click', function(){
      nav.querySelectorAll('button').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      document.querySelectorAll('section.panel').forEach(function(p){p.classList.remove('active');});
      document.getElementById('panel-'+t.id).classList.add('active');
    });
    nav.appendChild(b);
  });
  document.getElementById('panel-'+TABS[0].id).classList.add('active');
}

function initFilter(){
  var sel = document.getElementById('setorFilter');
  var opt = document.createElement('option'); opt.value='Todos'; opt.textContent='Todos os setores'; sel.appendChild(opt);
  DATA.setores.forEach(function(s){
    var o = document.createElement('option'); o.value=s.setor; o.textContent=niceName(s.setor); sel.appendChild(o);
  });
  sel.addEventListener('change', function(){
    currentSetor = sel.value;
    rebuildActive();
  });
}

function initTheme(){
  var btn = document.getElementById('themeToggle');
  btn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var mql = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next;
    if(!cur) next = mql ? 'light' : 'dark';
    else next = cur==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
  });
}

function initHeader(){
  document.getElementById('subtitle').textContent =
    'Distrital '+niceName(DATA.file_info.distrital)+' · Período '+DATA.file_info.periodo_anterior+' → '+DATA.file_info.periodo_atual+' · '+fmtInt(DATA.meta.n_setores)+' setores · '+fmtInt(DATA.meta.n_marcas)+' marcas · '+fmtInt(DATA.meta.n_bricks)+' bricks · '+fmtInt(DATA.meta.n_pdvs)+' PDVs';
  document.getElementById('foot-file').textContent = DATA.file_info.nome_arquivo;
}

initHeader();
initTabs();
initFilter();
initTheme();
rebuildActive();

})();

</script>
